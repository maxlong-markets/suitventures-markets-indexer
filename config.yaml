# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: suitventures-markets-indexer
description: Memestock pools on Robinhood Chain (Uniswap v4), holders and Chainlink USD prices
disable_default_cross_chain: true
contracts:
  - name: PoolManager
    events:
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)
        field_selection:
          transaction_fields:
            - hash
            - from
      - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int256 liquidityDelta, bytes32 salt)
      - event: Donate(bytes32 indexed id, address indexed sender, uint256 amount0, uint256 amount1)
  - name: Token
    # No address: registered from PoolManager.Initialize
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
  - name: ChainlinkProxy
    events:
      - event: AggregatorConfirmed(address indexed previous, address indexed latest)
  - name: ChainlinkAggregator
    # Static list from config/quotes.json plus rotations registered from AggregatorConfirmed
    events:
      - event: AnswerUpdated(int256 indexed current, uint256 indexed roundId, uint256 updatedAt)
chains:
