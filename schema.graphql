enum Origin {
  LONG
  Pons
  Uniswap
  Other
  SUIT
  SV
}

enum Side {
  buy
  sell
}

enum Interval {
  m1
  m5
  m15
  h1
  d1
}

# Allowlisted quote asset (rows seeded from config/quotes.json on first sight).
type Quote {
  id: ID!               # lowercase address
  address: String!      # checksummed
  symbol: String!
  name: String!
  decimals: Int!
  enabled: Boolean!     # false: keep existing pools, stop discovering new ones
}

# Latest USD price per quote from its Chainlink feed (USDG pinned at 1).
type QuotePrice {
  id: ID!               # quote id
  quote: Quote!
  usdPrice: Float!
  updatedAt: Int!       # feed updatedAt, unix seconds
  aggregator: String!   # lowercase aggregator address, or "pinned"
}

# Aggregator address to quote, so AnswerUpdated finds its quote after a rotation.
type QuoteFeed {
  id: ID!               # lowercase aggregator address
  quote: Quote!
  decimals: Int!
  proxy: String!
  active: Boolean!      # false once a proxy rotates away from this aggregator
}

type Token {
  id: ID!               # lowercase address
  address: String!
  symbol: String!
  name: String!
  decimals: Int!
  metadataLoaded: Boolean!
  metadataRetryAt: Int!     # block time after which a failed metadata read is retried; 0 once loaded
  historyLoaded: Boolean!   # pre-registration transfers replayed (see src/effects/transferHistory.ts)
  totalSupply: BigInt!  # running sum of mints minus burns
  holdersCount: Int!
  poolCount: Int!
  origin: Origin!       # origin of primaryPool
  primaryPool: Pool
  createdAt: Int!       # block time of the first discovered pool or transfer
  pools: [Pool!]! @derivedFrom(field: "token")
}

type Pool @index(fields: ["token", ["lastSwapAt", "DESC"]]) {
  id: ID!               # poolId (bytes32, lowercase)
  token: Token!          # composite index above already leads with token; no single-field index needed
  quote: Quote! @index
  tokenIsCurrency0: Boolean!
  hooks: String!
  fee: Int!
  tickSpacing: Int!
  origin: Origin!
  createdAt: Int!
  priceQuote: Float!    # token price in quote units, post-swap pool price
  sqrtPriceX96: BigInt!
  tvlToken: BigInt      # raw; null until liquidity accounting is live
  tvlQuote: BigInt
  swapCount: Int!
  lastSwapAt: Int
  volumeQuoteAllTime: Float!
}

type Swap @index(fields: ["pool", ["timestamp", "DESC"]]) {
  id: ID!               # txHash-logIndex
  pool: Pool!
  token: Token!
  timestamp: Int!
  side: Side!
  amountToken: Float!
  amountQuote: Float!
  priceQuote: Float!    # execution price, pre-hook-fee
  wallet: String!
  txHash: String!
}

type Candle @index(fields: ["pool", "interval", ["t", "DESC"]]) @index(fields: ["interval", "pool", ["t", "DESC"]]) {
  id: ID!               # poolId-interval-bucket
  pool: Pool!
  interval: Interval!
  t: Int!               # bucket start, unix seconds
  open: Float!
  high: Float!
  low: Float!
  close: Float!
  volumeQuote: Float!
  volumeToken: Float!
  trades: Int!
}

type TokenBalance @index(fields: ["token", ["balance", "DESC"]]) {
  id: ID!               # tokenId-holder
  token: Token!
  holder: String!       # lowercase
  balance: BigInt!
  updatedAt: Int!
}
