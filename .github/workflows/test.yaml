name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run codegen
      - run: npx tsc --noEmit
      - run: npm test
        env:
          ENVIO_CANDLES_1M_START_BLOCK: "0"
          ENVIO_CANDLES_5M_START_BLOCK: "0"
